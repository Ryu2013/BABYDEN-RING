<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>BABYDEN RING</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;700&family=Shippori+Mincho:wght@500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="stage">
  <div id="viewport">
    <canvas id="game-canvas" width="960" height="540"></canvas>

    <div id="title-screen" class="screen">
      <img id="logo-image" src="assets/logo_title.png" alt="BABYDEN RING" />
      <p class="subtitle">おしゃぶりの勇者は、玉座を目指す。</p>

      <div class="title-form">
        <label for="password-input">合言葉（お持ちの場合）</label>
        <input id="password-input" type="text" inputmode="text" autocomplete="off" placeholder="例: 01-K" />
        <p id="password-error" class="error"></p>
        <button id="start-button" class="fs-button">た た か う</button>
      </div>

      <dl id="controls-help">
        <div><dt>移動</dt><dd>← →</dd></div>
        <div><dt>ロール</dt><dd>← ← / Space</dd></div>
        <div><dt>攻撃（長押しで溜め）</dt><dd>J</dd></div>
        <div><dt>ジャンプ</dt><dd>↑</dd></div>
        <div><dt>エスト瓶</dt><dd>F</dd></div>
      </dl>
      <p class="hint">ガードは無い。敵の一撃に合わせて攻撃ボタンを押せば、それがパリィになる。</p>
    </div>

    <div id="select-screen" class="screen" hidden>
      <h2 class="screen-title">生 ま れ を 選 べ</h2>
      <div id="select-body">
        <figure id="select-portrait"><img id="select-portrait-img" alt="" /></figure>
        <div id="select-info">
          <p id="select-name"></p>
          <p id="select-tagline"></p>
          <dl id="select-stats"></dl>
          <p id="select-detail"></p>
        </div>
      </div>
      <div id="select-list"></div>
      <div class="select-actions">
        <button id="select-back" class="fs-button ghost">も ど る</button>
        <button id="select-confirm" class="fs-button">こ の 生 ま れ で</button>
      </div>
    </div>

    <div id="hud" class="screen" hidden>
      <div class="boss-info">
        <span id="boss-name"></span>
        <div class="hp-bar boss-hp-bar"><div id="boss-hp-fill" class="hp-fill"></div></div>
        <div class="poise-bar boss-poise-bar"><div id="boss-poise-fill" class="poise-fill"></div></div>
      </div>
      <div id="timer-display" class="timer">00:00.00</div>
      <div class="player-info">
        <div class="hp-bar player-hp-bar"><div id="player-hp-fill" class="hp-fill"></div></div>
        <div class="hp-bar stamina-bar"><div id="player-stamina-fill" class="hp-fill"></div></div>
        <div class="poise-bar player-poise-bar"><div id="player-poise-fill" class="poise-fill"></div></div>
        <div id="flask-row" class="flask-row"></div>
      </div>
    </div>

    <div id="victory-screen" class="screen" hidden>
      <h2 class="banner">ENEMY FELLED</h2>
      <p class="banner-sub">撃 破</p>
      <p>タイム: <span id="victory-time"></span></p>
      <p id="victory-password-row">つぎの合言葉: <span id="victory-password" class="password"></span></p>
      <p id="all-clear-message" hidden>すべてのボスを撃破した。おめでとう。</p>
      <button id="retry-button" class="fs-button ghost">タイトルへ</button>
    </div>

    <div id="gameover-screen" class="screen" hidden>
      <h2 class="banner died">YOU DIED</h2>
      <p class="banner-sub">や ら れ た</p>
      <div class="screen-actions">
        <button id="gameover-retry-button" class="fs-button">も う 一 度 挑 む</button>
        <button id="gameover-title-button" class="fs-button ghost">タ イ ト ル へ</button>
      </div>
    </div>

  </div>

    <p id="rotate-hint">横向きにすると画面が大きくなります</p>

    <div id="touch-controls" hidden>
      <div class="touch-left">
        <button id="btn-left" class="touch-btn">◀</button>
        <button id="btn-right" class="touch-btn">▶</button>
      </div>
      <div class="touch-right">
        <button id="btn-heal" class="touch-btn small">瓶<span id="btn-heal-count">3</span></button>
        <button id="btn-jump" class="touch-btn small">跳</button>
        <button id="btn-attack" class="touch-btn primary">攻</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
